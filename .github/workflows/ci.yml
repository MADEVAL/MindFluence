name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install check dependencies
        run: pip install pyyaml
      - name: Check frontmatter, versions, and relative links
        run: |
          python - <<'PY'
          import os, re, sys
          import yaml

          skill_dir = "skills/mindfluence"
          text = open(f"{skill_dir}/SKILL.md", encoding="utf-8").read()
          m = re.match(r"^---\n(.*?)\n---\n", text, re.S)
          if not m:
              sys.exit("SKILL.md: missing frontmatter")
          fm = yaml.safe_load(m.group(1))
          for field in ("name", "description", "license", "compatibility"):
              if not fm.get(field):
                  sys.exit(f"SKILL.md: missing {field}")
          version = str(fm.get("metadata", {}).get("version", ""))
          if version.count(".") != 2:
              sys.exit("SKILL.md: metadata.version must be X.Y.Z")
          changelog = open("CHANGELOG.md", encoding="utf-8").read()
          if f"[{version}]" not in changelog:
              sys.exit(f"CHANGELOG.md: no entry for {version}")

          body = re.sub(r"```.*?```", "", text, flags=re.S)
          links = set(re.findall(r"`((?:references|scenarios|examples)/[^`]+)`", body))
          links |= set(re.findall(r"\]\(((?:references|scenarios|examples)/[^)]+)\)", body))
          missing = [p for p in sorted(links) if not os.path.exists(os.path.join(skill_dir, p))]
          if missing:
              sys.exit("SKILL.md: broken relative paths: " + ", ".join(missing))
          print("frontmatter, version, and links OK")
          PY
      - name: Check installer plan
        run: python install.py --target project --dry-run
